name: MACsec CP unit test

# These MACsec unit tests need only a C compiler.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  macsec-cp-wedge-ut:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Build the MACsec CP wedge unit test
        run: make -C tests test-macsec_cp_wedge

      - name: Run the MACsec CP wedge unit test
        run: ./tests/test-macsec_cp_wedge

      - name: Check the MACsec status reply text and length
        run: |
          make -C tests test-macsec_status
          ./tests/test-macsec_status
